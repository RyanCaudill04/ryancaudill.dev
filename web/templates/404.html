    <div class="terminal__bar"><span class="terminal__dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="terminal__title">ryan@pi: ~</span></div>

      <p class="cmd"><span>$</span> cat this-page</p>

      <p class="cmd"><span>$</span> <span class="cursor"></span></p>
    </div>
  </div>
</main>

{{template "foot" .}}
