    host: ai.ryancaudill.dev
    url: https://ai.ryancaudill.dev
    description: OpenAI-compatible gateway over free-tier LLM providers, with a chat UI

  - id: play
    host: play.ryancaudill.dev
    url: https://play.ryancaudill.dev
    description: Live status, players and world map for the Minecraft server

  - id: minecraft
    host: mc.ryancaudill.dev
    description: Minecraft Java server; sleeps until someone joins

  - id: admin
    host: admin.ryancaudill.dev
    url: https://admin.ryancaudill.dev
    description: Runs the Minecraft server; sign-in required

# Past projects, shown under `ls ~/archive`. Empty hides the section.
archive:
  - name: gradingagent
    description: Automated grader for CSCE 247 Java assignments; Django frontend, FastAPI backend, PostgreSQL and Gemini-based code review
    url: https://github.com/RyanCaudill04/GradingAgent
  - name: cifar
    description: PyTorch CNN image classifier for CIFAR-10, tuned for Apple Silicon with mixed-precision training
    url: https://github.com/RyanCaudill04/CIFAR
  - name: maestro_demo
    description: ROS2 demo for synchronizing camera streams, run in Docker; built for my perception research with the IMSEL lab
