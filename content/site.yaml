# Everything the page says lives in this file.
# Edit it, then refresh `make dev` to see the change. Text in [brackets]
# is a placeholder to replace.

name: Ryan Caudill
role: Software engineer at Oracle Cloud Infrastructure
about:
  - "I'm a software engineer at Oracle Cloud Infrastructure. I studied computer science at the University of South Carolina (B.S., with a minor in Spanish), and I've worked on a camera-synchronization system built on ROS2, a web app for the state transportation department, and a few machine learning projects."
  - "On my own time I build in Go: a gateway that spreads requests across free-tier LLM providers, and the web tools that run a Minecraft server. I'm learning more about running services of my own, from Docker and Cloudflare to the Linux box underneath. Every project below runs on a Raspberry Pi 5 on my desk."
board: Raspberry Pi 5 · 16 GB · Debian 13

# The hardware section: one card per layer of the 3D model, top layer
# first. Scrolling takes the model apart, and each card points at its part.
#   part      the piece of the model the card points at: ssd, hat or pi
#   label     the small heading above the name
#   specs     short name/value rows under the summary; leave out for none
hardware:
  - part: ssd
    label: Storage
    name: Silicon Power P34A60
    summary: "A 512 GB NVMe drive on the Pi's PCIe lane: quicker than a microSD card, and far happier with the constant small writes a server makes."
    specs:
      - { name: Capacity, value: 512 GB }
      - { name: Interface, value: "NVMe, PCIe Gen 3" }
      - { name: Size, value: "M.2 2280, M key" }

  - part: hat
    label: Bridge
    name: GeeekPi P33 M.2 NVMe PoE+ HAT
    summary: "Carries the drive. A ribbon cable brings the Pi's single PCIe lane up to an M.2 slot long enough for a full-length drive, and four standoffs hold the whole thing over the board. It can also power the Pi from the network cable."
    specs:
      - { name: Link, value: "PCIe, one lane" }
      - { name: Slot, value: "M.2 M key, 2230 to 2280" }
      - { name: Power, value: "PoE+ (802.3at), up to 25.5 W" }

  - part: pi
    label: Compute
    name: Raspberry Pi 5
    summary: "The computer itself: a quad-core Arm board the size of a credit card. It runs Debian and every project below."
    specs:
      - { name: SoC, value: "BCM2712, 4 × Cortex-A76 at 2.4 GHz" }
      - { name: Memory, value: 16 GB LPDDR4X }
      - { name: OS, value: Debian 13 }

# The SSD drawn on the 3D model: its M.2 size, 2230, 2242, 2260 or 2280
# (the last two digits are its length in millimetres). 2280 is drawn with
# the Silicon Power drive's label; the shorter ones get a plain sticker.
drive: "2280"

# Shown in the footer with the current time there. Leave either out to
# hide it. timezone is an IANA name, e.g. America/Chicago.
location: Nashville, TN
timezone: America/Chicago

# Put the PDF at web/static/resume.pdf, then set this to /static/resume.pdf.
# Empty hides the download button.
resume_pdf: /static/resume.pdf

links:
  - label: GitHub
    url: https://github.com/RyanCaudill04

# Active projects: one row each in the terminal, with a light (always on
# for now).
#   id          the unit name shown in the terminal
#   host        the address shown
#   url         where the row links; leave out when it isn't a web page
projects:
